name: Security Drift Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  security-drift-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        npm ci
        cd backend && npm ci

    - name: Run Security Drift Gates
      run: |
        chmod +x scripts/security-drift-check.sh
        ./scripts/security-drift-check.sh
