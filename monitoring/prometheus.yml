global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'payroll-platform'
    environment: 'development'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Load rules once and periodically evaluate them (optional)
# rule_files:
#   - 'alerts/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Payroll Platform Application
  - job_name: 'payroll-platform'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: 'payroll-platform'
          environment: 'development'
    scrape_interval: 15s
    scrape_timeout: 10s
