services:
  postgres:
    image: postgres:16-alpine
    container_name: external-workforce-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: external_workforce_platform
      POSTGRES_PASSWORD: password
      POSTGRES_DB: external_workforce_platform
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U external_workforce_platform']
      interval: 10s
      timeout: 5s
      retries: 5

  mock-oracle:
    image: node:20-alpine
    container_name: external-workforce-platform-mock-oracle
    restart: unless-stopped
    working_dir: /app/mock-oracle
    command: node server.js
    ports:
      - '8088:8080'
    environment:
      MOCK_ORACLE_PORT: 8080
    volumes:
      - ./mock-oracle:/app/mock-oracle
      - ./backend/test/fixtures:/app/backend/test/fixtures:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: external-workforce-platform-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://external_workforce_platform:password@postgres:5432/external_workforce_platform
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      API_KEY_SALT: ${API_KEY_SALT:-dev-api-key-salt}
      CORS_ORIGIN: http://localhost:3001
      PORT: 3000
      DEMO_MODE: ${DEMO_MODE:-true}
      # PR-DEMO-CONNECTOR-1 — mock upstream Oracle REST (see mock-oracle service)
      ORACLE_PROCUREMENT_REST_ENABLED: ${ORACLE_PROCUREMENT_REST_ENABLED:-true}
      ORACLE_PROCUREMENT_REST_BASE_URL: ${ORACLE_PROCUREMENT_REST_BASE_URL:-http://mock-oracle:8080/mock-oracle/procurement}
      ORACLE_PROCUREMENT_REST_SUPPLIERS_PATH: ${ORACLE_PROCUREMENT_REST_SUPPLIERS_PATH:-/suppliers}
      ORACLE_PROCUREMENT_REST_USERNAME: ${ORACLE_PROCUREMENT_REST_USERNAME:-demo}
      ORACLE_PROCUREMENT_REST_PASSWORD: ${ORACLE_PROCUREMENT_REST_PASSWORD:-demo}
      HCM_ORACLE_REST_ENABLED: ${HCM_ORACLE_REST_ENABLED:-true}
      HCM_ORACLE_REST_BASE_URL: ${HCM_ORACLE_REST_BASE_URL:-http://mock-oracle:8080/mock-oracle/hcm}
      HCM_ORACLE_REST_WORKERS_PATH: ${HCM_ORACLE_REST_WORKERS_PATH:-/workers}
      HCM_ORACLE_REST_USERNAME: ${HCM_ORACLE_REST_USERNAME:-demo}
      HCM_ORACLE_REST_PASSWORD: ${HCM_ORACLE_REST_PASSWORD:-demo}
      # PR-SPONSOR-REFERENCE-ONLY-1 — must match seed when using sponsor@ demo inbox
      RESPONSIBLE_MANAGER_ACCOUNTABILITY_INBOX_ENABLED: ${RESPONSIBLE_MANAGER_ACCOUNTABILITY_INBOX_ENABLED:-false}
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/scripts:/app/scripts
      - ./backend/package.json:/app/package.json
    depends_on:
      postgres:
        condition: service_healthy
      mock-oracle:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health/liveness || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: external-workforce-platform-frontend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-true}
      BACKEND_URL: http://backend:3000
    volumes:
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/pages:/app/pages
      - ./frontend/services:/app/services
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
