services:
  postgres:
    image: postgres:16-alpine
    container_name: contractor-cms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contractor_cms
      POSTGRES_PASSWORD: password
      POSTGRES_DB: contractor_cms
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contractor_cms']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contractor-cms-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://contractor_cms:password@postgres:5432/contractor_cms
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-in-production}
      API_KEY_SALT: ${API_KEY_SALT:-dev-api-key-salt}
      CORS_ORIGIN: http://localhost:3001
      PORT: 3000
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/v1/health/liveness || exit 1']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contractor-cms-frontend
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      BACKEND_URL: http://backend:3000
    volumes:
      - ./frontend/next.config.js:/app/next.config.js
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/pages:/app/pages
      - ./frontend/services:/app/services
      - ./frontend/public:/app/public
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
